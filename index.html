<html lang="ja">
	<head>
		<title>アスユイのお気に入りワールド</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/custom.css?v=20261123" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body>
		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header">
						<div class="inner">

							<div>
								<p class="site-type">VRChat</p>
								<h1>アスユイのお気に入りワールド</h1>
							</div>
							<section id="today" aria-label="今日のワールド">
								<div id="todayRow"></div>
							</section>

						</div>
					</header>

				<!-- Main -->
					<div id="main">
						<div class="inner">
							<section id="catalog" aria-label="ワールド一覧">
								<nav aria-label="カテゴリ"><ul class="cats" id="cattabs"></ul></nav>
								<div class="controls">
									<input type="search" id="q" data-ws-search placeholder="名前・タグ・説明・定員で検索" aria-label="ワールドを検索" autocomplete="off" />
									<select id="sort" aria-label="並び替え">
										<option value="fav">お気に入り数順</option><option value="new">新着順</option><option value="visits">訪問数順</option>
										<option value="name">名前順</option><option value="cap">定員が多い順</option><option value="capmin">定員が少ない順</option>
									</select>
									<div class="views" id="views" role="group" aria-label="表示形式"><button type="button" data-v="grid">写真</button><button type="button" data-v="list">一覧</button></div>
								</div>
								<ul class="tags" id="chips" aria-label="タグで絞り込む"></ul>
								<div class="result-bar">
									<p class="count" id="count" role="status"></p>
									<button type="button" id="random">ランダムに開く</button>
								</div>
								<div id="stage"></div>
							</section>
						</div>
					</div>

				<!-- Footer -->
					<footer id="footer">
						<div class="inner">
							<ul class="copyright">
								<li>&copy; アスユイ</li><li>テンプレート <a href="https://html5up.net">HTML5 UP</a></li>
							</ul>
						</div>
					</footer>

			</div>

		<!-- 詳細 -->
			<div id="detail" class="ws-overlay"><div class="ws-sheet" id="detailBody" role="dialog" aria-modal="true" aria-labelledby="worldTitle"></div></div>

		<!-- Scripts -->
			<script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');</script>
			<script src="assets/js/core.js"></script>
			<script>
			(function () {
				const { esc, num, img, url, catName } = WS;
				const $ = s => document.querySelector(s);
				$('#random').onclick = () => {
					const results = WS.list();
					WS.modal.open(WS.random(results), results);
				};

				/* 日替わりのワールド */
				let off = 0;
				function renderToday(w) {
					if (!w) { $('#today').hidden = true; return; }
					$('#todayRow').innerHTML = `
						<button type="button" class="today-link" data-open="${w.id}">
							<img src="${esc(img(w, 256))}" alt="" onerror="this.style.visibility='hidden'" />
							<span><small>今日のワールド</small><strong>${esc(w.name)}</strong></span>
						</button>
						<button type="button" id="reroll">別のワールド</button>`;
					$('#reroll').onclick = () => {
						renderToday(WS.daily(++off));
						$('#reroll').focus();
					};
				}
				renderToday(WS.daily(0));

				const qEl = $('#q'), sortEl = $('#sort');
				const thumbnail = (w, size) => `<span class="world-photo"><img loading="lazy" decoding="async" src="${esc(img(w, size))}" alt="" onerror="this.style.visibility='hidden'" /></span>`;
				const tile = w => `
					<article class="world">
						<button type="button" class="world-link" data-id="${w.id}">
							${thumbnail(w, 512)}
							<span class="world-name">${esc(w.name)}</span>
							<span class="world-meta">定員 ${w.capacity || '–'}人 <span>お気に入り ${num(w.favorites)}</span></span>
							${w.note ? `<span class="world-note">${esc(w.note)}</span>` : ''}
						</button>
					</article>`;
				$('#cattabs').innerHTML = WS.C.map(c => `<li><button type="button" data-cat="${c.id}">${esc(c.name)}</button></li>`).join('');
				let tagsFor;
				function render(S) {
					const c = WS.C.find(x => x.id === S.cat) || {};
					document.querySelectorAll('#cattabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === S.cat));
					if (document.activeElement !== qEl) qEl.value = S.q;
					sortEl.value = S.sort;
					document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.view));
					if (tagsFor !== S.cat) {
						$('#chips').innerHTML = WS.tagCounts().map(([t, n]) => `<li><button type="button" data-tag="${esc(t)}">${esc(t)}<span class="n">${n}</span></button></li>`).join('');
						tagsFor = S.cat;
					}
					document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', S.tags.has(b.dataset.tag)));
					const L = WS.list();
					$('#count').textContent = c.name + '　' + num(L.length) + '件';
					$('#random').disabled = !L.length;
					if (!L.length) { $('#stage').innerHTML = '<p class="empty">該当するワールドがありません。検索語やタグを変えてみてください。</p>'; return; }
					$('#stage').innerHTML = S.view === 'list'
						? `<div class="table-wrapper"><table class="alt"><thead><tr><th></th><th>ワールド</th><th>定員</th><th class="hide-s">お気に入り</th><th class="hide-s">訪問</th></tr></thead><tbody>`
							+ L.map(w => `<tr data-id="${w.id}"><td class="thumb"><img loading="lazy" decoding="async" src="${esc(img(w, 256))}" alt="" onerror="this.style.visibility='hidden'" /></td>
								<td><button type="button" class="table-world" data-id="${w.id}">${esc(w.name)}</button><br /><small>${esc(w.subtype || '')}${(w.tags || []).length ? '　' + esc(w.tags.slice(0, 3).join(' / ')) : ''}</small></td>
								<td>${w.capacity || '?'}</td><td class="hide-s">${num(w.favorites)}</td><td class="hide-s">${num(w.visits)}</td></tr>`).join('') + `</tbody></table></div>`
						: `<section class="world-grid" aria-label="ワールドの写真">${L.map(tile).join('')}</section>`;
				}
				WS.on(render);

				let t; qEl.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => WS.set({ q: e.target.value.trim() }), 120); });
				sortEl.addEventListener('change', e => WS.set({ sort: e.target.value }));
				$('#views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) WS.set({ view: b.dataset.v }); });
				document.addEventListener('click', e => {
					const f = e.target.closest('[data-cat]'); if (f) { clearTimeout(t); WS.set({ cat: f.dataset.cat }); return; }
					const ch = e.target.closest('#chips [data-tag]'); if (ch) { WS.toggleTag(ch.dataset.tag); return; }
					const o = e.target.closest('[data-open]'); if (o) { const w = WS.W.find(x => x.id === o.dataset.open); WS.modal.open(w, [w]); return; }
					const c = e.target.closest('#stage [data-id]'); if (c) { e.preventDefault(); WS.modal.open(WS.W.find(x => x.id === c.dataset.id), WS.list()); }
				});

				/* ワールド詳細 */
				WS.modal.mount($('#detail'), $('#detailBody'), (w, m) => `
					<button type="button" class="ws-close" data-ws-close aria-label="閉じる">閉じる</button>
					<div class="row gtr-uniform">
						<div class="col-7 col-12-medium"><span class="image fit"><img src="${esc(img(w, 1024))}" alt="" onerror="this.style.visibility='hidden'" /></span>
							${m.hasNav ? `<ul class="actions small nav-row"><li><button type="button" class="button small" data-ws-prev>&larr; 前へ</button></li><li class="pos">${m.pos} / ${m.total}</li><li><button type="button" class="button small" data-ws-next>次へ &rarr;</button></li></ul>` : ''}
						</div>
						<div class="col-5 col-12-medium">
							<p class="eyebrow">${esc(catName(w.category))}${w.subtype ? '　/　' + esc(w.subtype) : ''}</p>
							<h2 id="worldTitle">${esc(w.name)}</h2>
							<div class="table-wrapper"><table class="alt spec"><tbody>
								<tr><td>最大人数</td><td>${w.capacity || '?'}名</td></tr><tr><td>推奨人数</td><td>${w.recommendedCapacity || '?'}名</td></tr>
								<tr><td>お気に入り</td><td>${num(w.favorites)}</td></tr><tr><td>訪問数</td><td>${num(w.visits)}</td></tr>
							</tbody></table></div>
							<ul class="actions"><li><a class="button primary" href="${url(w.id)}" target="_blank" rel="noopener">VRChatで開く</a></li></ul>
						</div>
					</div>
					<h3>ワールドの説明</h3>
					<p class="description">${esc(w.note || '説明はありません。')}</p>
					${w.official ? `<details class="orig"><summary>VRChatに掲載されている説明</summary><p>${esc(w.official)}</p></details>` : ''}
					${(w.tags || []).length ? `<ul class="tags" aria-label="タグで絞り込む">${w.tags.map(t => `<li><button type="button" data-ws-tag="${esc(t)}">${esc(t)}</button></li>`).join('')}</ul>` : ''}
					${m.rel.length ? `<h3>関連ワールド</h3><section class="world-grid related">${m.rel.map(r => `<button type="button" class="world-link" data-ws-rel="${r.id}">${thumbnail(r, 256)}<span class="world-name">${esc(r.name)}</span></button>`).join('')}</section>` : ''}`);
			})();
			</script>
	</body>
</html>

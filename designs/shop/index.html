<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="アスユイのお気に入りVRChatワールドを売り場ごとに並べたショップ" />
        <title>ASUYUI WORLD SHOP｜アスユイのお気に入りワールド</title>
        <!-- Template: Shop Homepage + Shop Item by Start Bootstrap (MIT) https://startbootstrap.com/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <link href="custom.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand fw-bolder" href="#">ASUYUI WORLD SHOP</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="メニュー"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link" href="#today">本日の一点</a></li>
                        <li class="nav-item"><a class="nav-link" href="#arrivals">新着入荷</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">売り場</a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown" id="navcats"></ul>
                        </li>
                    </ul>
                    <form class="d-flex me-lg-2 mb-2 mb-lg-0" id="sform" role="search">
                        <input class="form-control me-2" id="q" data-ws-search type="search" placeholder="ワールド名・タグ・説明で検索（ / ）" aria-label="検索" />
                        <button class="btn btn-outline-dark flex-shrink-0" type="submit"><i class="bi-search"></i></button>
                    </form>
                    <button class="btn btn-outline-dark" type="button" id="lucky">
                        <i class="bi-shuffle me-1"></i>
                        おまかせ
                    </button>
                </div>
            </div>
        </nav>
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">アスユイのお気に入りワールド</h1>
                    <p class="lead fw-normal text-white-50 mb-0" id="tagline">VRChatで見つけたワールドを、売り場ごとに並べています</p>
                </div>
            </div>
        </header>
        <!-- 本日の一点 (Shop Item: Product section)-->
        <section class="py-5" id="today">
            <div class="container narrow px-4 px-lg-5 my-5">
                <div class="row gx-4 gx-lg-5 align-items-center" id="todayRow"></div>
            </div>
        </section>
        <!-- 新着入荷 (Shop Item: Related items section)-->
        <section class="py-5 bg-light" id="arrivals">
            <div class="container px-4 px-lg-5 mt-5">
                <h2 class="fw-bolder mb-4">新着入荷</h2>
                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 row-cols-xxl-5 justify-content-center" id="arrivalRow"></div>
            </div>
        </section>
        <!-- 売り場 (Shop Homepage: Section)-->
        <section class="py-5" id="catalog">
            <div class="container px-4 px-lg-5 mt-4">
                <div class="d-flex flex-wrap align-items-baseline gap-3 mb-3">
                    <h2 class="fw-bolder mb-0" id="ctitle"></h2>
                    <span class="text-muted" id="cdesc"></span>
                </div>
                <ul class="nav nav-pills mb-4 gap-2" id="cattabs"></ul>
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                    <select class="form-select w-auto" id="sort" aria-label="並び替え">
                        <option value="fav">人気順</option>
                        <option value="new">新着順</option>
                        <option value="visits">訪問数順</option>
                        <option value="name">名前順</option>
                        <option value="cap">定員が多い順</option>
                        <option value="capmin">定員が少ない順</option>
                    </select>
                    <div class="btn-group" role="group" id="views">
                        <button type="button" class="btn btn-outline-dark" data-v="grid"><i class="bi-grid-3x3-gap-fill me-1"></i>商品一覧</button>
                        <button type="button" class="btn btn-outline-dark" data-v="list"><i class="bi-list-ul me-1"></i>リスト</button>
                    </div>
                    <span class="text-muted ms-2" id="count"></span>
                </div>
                <div class="d-flex flex-wrap gap-2 mb-5" id="chips"></div>
                <div id="stage"></div>
            </div>
        </section>
        <!-- 詳細 (Shop Item layout in Bootstrap modal)-->
        <div class="modal fade" id="detail" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content" id="detailBody"></div>
            </div>
        </div>
        <!-- Footer-->
        <footer class="py-5 bg-dark">
            <div class="container">
                <p class="m-0 text-center text-white">&copy; アスユイ ・ 営業時間 24時間（VRChat内）</p>
                <p class="m-0 mt-2 text-center text-white-50 small">Template: <a class="link-light" href="https://startbootstrap.com/template/shop-homepage" target="_blank" rel="noopener">Shop Homepage</a> / <a class="link-light" href="https://startbootstrap.com/template/shop-item" target="_blank" rel="noopener">Shop Item</a> by Start Bootstrap (MIT)</p>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>document.write('<script src="../../data.js?v=' + Date.now() + '"><\/script>');</script>
        <script src="../core.js"></script>
        <script>
        (function () {
            const { esc, num, img, url, catName } = WS;
            const $ = s => document.querySelector(s);
            const CODE = { exhibition: 'EX', particle: 'PT', misc: 'MS', recommend: 'RC', todo: 'TD', chill: 'CH', game: 'GM' };
            const sku = w => (CODE[w.category] || 'WD') + '-' + String(WS.exhibitNo(w)).padStart(3, '0');
            const newIds = new Set(WS.newest(30).map(w => w.id));
            $('#tagline').textContent = 'VRChatで見つけた' + WS.W.length + 'のワールドを、売り場ごとに並べています';

            /* Shop Homepage の商品カード */
            const card = w => `
                <div class="col mb-5">
                    <div class="card h-100" role="button" tabindex="0" data-id="${w.id}">
                        ${newIds.has(w.id) ? '<div class="badge bg-dark text-white position-absolute" style="top: 0.5rem; right: 0.5rem">NEW</div>' : ''}
                        <img class="card-img-top" loading="lazy" decoding="async" src="${esc(img(w, 512))}" alt="" onerror="this.style.visibility='hidden'" />
                        <div class="card-body p-4">
                            <div class="text-center">
                                <div class="small text-muted mb-1">${sku(w)}${w.subtype ? '・' + esc(w.subtype) : ''}</div>
                                <h5 class="fw-bolder item-name">${esc(w.name)}</h5>
                                <div class="d-flex justify-content-center small text-warning mb-2"><div class="bi-star-fill me-1"></div><span class="text-muted">${num(w.favorites)}</span></div>
                                定員 ${w.capacity || '?'}名
                            </div>
                        </div>
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="text-center"><span class="btn btn-outline-dark mt-auto">詳しく見る</span></div>
                        </div>
                    </div>
                </div>`;

            /* 本日の一点（Shop Item の Product section） */
            let off = 0;
            function renderToday(w) {
                $('#todayRow').innerHTML = `
                    <div class="col-md-6"><img class="card-img-top mb-5 mb-md-0 today-img" src="${esc(img(w, 2048))}" alt="" data-open="${w.id}" onerror="this.style.visibility='hidden'" /></div>
                    <div class="col-md-6">
                        <div class="small mb-1">本日の一点 ・ ${WS.todayLabel()} ・ 品番 ${sku(w)}</div>
                        <h1 class="display-5 fw-bolder">${esc(w.name)}</h1>
                        <div class="fs-5 mb-4"><span>定員 ${w.capacity || '?'}名</span> <span class="text-muted small ms-2">推奨 ${w.recommendedCapacity || '?'}名</span> <span class="text-warning small ms-2"><i class="bi-star-fill"></i></span> <span class="text-muted small">${num(w.favorites)}</span></div>
                        <p class="lead">${esc(w.note || '')}</p>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-dark flex-shrink-0" type="button" data-open="${w.id}"><i class="bi-bag-fill me-1"></i>詳しく見る</button>
                            <button class="btn btn-outline-secondary flex-shrink-0" type="button" id="reroll"><i class="bi-arrow-repeat me-1"></i>別の一点</button>
                        </div>
                    </div>`;
                $('#reroll').onclick = () => renderToday(WS.daily(++off));
            }
            renderToday(WS.daily(0));

            const arrivals = WS.newest(10);
            $('#arrivalRow').innerHTML = arrivals.map(card).join('');

            /* 売り場 */
            const qEl = $('#q'), sortEl = $('#sort');
            $('#navcats').innerHTML = WS.C.map(c => `<li><a class="dropdown-item" href="#catalog" data-cat="${c.id}">${esc(c.name)} <span class="text-muted small">${WS.inCat(c.id).length}</span></a></li>`).join('')
                + '<li><hr class="dropdown-divider" /></li><li><a class="dropdown-item" href="#catalog" data-sort="fav">人気商品</a></li><li><a class="dropdown-item" href="#catalog" data-sort="new">新着順に見る</a></li>';
            function render(S) {
                const c = WS.C.find(x => x.id === S.cat) || {};
                $('#ctitle').textContent = '売り場：' + (c.name || '');
                $('#cdesc').textContent = c.desc || '';
                $('#cattabs').innerHTML = WS.C.map(x => `<li class="nav-item"><a class="nav-link${x.id === S.cat ? ' active' : ''}" href="#catalog" data-cat="${x.id}">${esc(x.name)} <span class="badge rounded-pill ${x.id === S.cat ? 'bg-light text-dark' : 'bg-secondary'}">${WS.inCat(x.id).length}</span></a></li>`).join('');
                if (document.activeElement !== qEl) qEl.value = S.q;
                sortEl.value = S.sort;
                document.querySelectorAll('#views button').forEach(b => b.classList.toggle('active', b.dataset.v === S.view));
                $('#chips').innerHTML = WS.tagCounts().map(([t, n]) => `<button type="button" class="btn btn-sm rounded-pill ${S.tags.has(t) ? 'btn-dark' : 'btn-outline-secondary'}" data-tag="${esc(t)}">${esc(t)} <span class="opacity-75">${n}</span></button>`).join('');
                const L = WS.list();
                $('#count').textContent = L.length + ' 点';
                if (!L.length) { $('#stage').innerHTML = '<p class="text-center text-muted py-5">条件に合う商品が見つかりませんでした。</p>'; return; }
                $('#stage').innerHTML = S.view === 'list'
                    ? `<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th style="width:120px"></th><th>ワールド</th><th class="text-end">定員</th><th class="text-end d-none d-md-table-cell">お気に入り</th><th class="text-end d-none d-md-table-cell">訪問</th></tr></thead><tbody>`
                        + L.map(w => `<tr role="button" data-id="${w.id}"><td><img class="rounded list-thumb" loading="lazy" decoding="async" src="${esc(img(w, 256))}" alt="" onerror="this.style.visibility='hidden'" /></td>
                            <td><div class="fw-bold">${esc(w.name)}</div><div class="small text-muted">${sku(w)}${w.subtype ? '・' + esc(w.subtype) : ''}${(w.tags || []).length ? '・' + esc(w.tags.slice(0, 3).join(' / ')) : ''}</div></td>
                            <td class="text-end">${w.capacity || '?'}名</td><td class="text-end d-none d-md-table-cell">${num(w.favorites)}</td><td class="text-end d-none d-md-table-cell">${num(w.visits)}</td></tr>`).join('') + `</tbody></table></div>`
                    : `<div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 row-cols-xxl-5 row-cols-3xl-6">${L.map(card).join('')}</div>`;
            }
            WS.on(render);

            let t; qEl.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => WS.set({ q: e.target.value.trim() }), 120); });
            $('#sform').addEventListener('submit', e => { e.preventDefault(); WS.set({ q: qEl.value.trim() }); $('#catalog').scrollIntoView({ behavior: 'smooth' }); });
            sortEl.addEventListener('change', e => WS.set({ sort: e.target.value }));
            $('#views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) WS.set({ view: b.dataset.v }); });
            const openFrom = el => {
                const w = WS.W.find(x => x.id === el.dataset.id);
                const L = el.closest('#arrivalRow') ? arrivals : WS.list();
                WS.modal.open(w, L);
            };
            const goTo = id => { const el = id ? document.getElementById(id) : null; el ? el.scrollIntoView({ behavior: 'smooth' }) : window.scrollTo({ top: 0, behavior: 'smooth' }); };
            document.addEventListener('click', e => {
                const a = e.target.closest('a[href^="#"]:not([data-bs-toggle])');
                if (a) e.preventDefault();
                const f = e.target.closest('[data-cat]'); if (f) { WS.set({ cat: f.dataset.cat }); if (f.closest('.dropdown-menu')) goTo('catalog'); return; }
                const s = e.target.closest('[data-sort]'); if (s) { WS.set({ sort: s.dataset.sort }); goTo('catalog'); return; }
                if (a) { goTo(a.getAttribute('href').slice(1)); return; }
                const ch = e.target.closest('#chips [data-tag]'); if (ch) { WS.toggleTag(ch.dataset.tag); return; }
                const o = e.target.closest('[data-open]'); if (o) { const w = WS.W.find(x => x.id === o.dataset.open); WS.modal.open(w, [w]); return; }
                const c = e.target.closest('#stage [data-id], #arrivalRow [data-id]'); if (c) openFrom(c);
            });
            document.addEventListener('keydown', e => {
                if (e.key !== 'Enter') return;
                const c = e.target.closest && e.target.closest('#stage [data-id], #arrivalRow [data-id]'); if (c) openFrom(c);
            });
            $('#lucky').onclick = () => { const L = WS.list(); const w = WS.random(L.length ? L : WS.W); WS.modal.open(w, L.length ? L : [w]); };

            /* 詳細: Shop Item のレイアウトを Bootstrap モーダルで */
            const modalEl = $('#detail');
            const bsModal = new bootstrap.Modal(modalEl);
            modalEl.addEventListener('hidden.bs.modal', () => WS.modal.markClosed());
            WS.modal.mount(modalEl, $('#detailBody'), (w, m) => `
                <div class="modal-body p-4 p-lg-5">
                    <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-ws-close aria-label="閉じる"></button>
                    <div class="row gx-4 gx-lg-5 align-items-center">
                        <div class="col-lg-6"><img class="card-img-top mb-4 mb-lg-0 rounded" src="${esc(img(w, 1024))}" alt="" onerror="this.style.visibility='hidden'" /></div>
                        <div class="col-lg-6">
                            <div class="small mb-1">品番 ${sku(w)} ・ ${esc(catName(w.category))}${w.subtype ? ' ・ ' + esc(w.subtype) : ''}</div>
                            <h2 class="display-6 fw-bolder">${esc(w.name)}</h2>
                            <div class="fs-5 mb-3">定員 ${w.capacity || '?'}名 <span class="text-muted small ms-2">推奨 ${w.recommendedCapacity || '?'}名</span></div>
                            <div class="small text-muted mb-3"><span class="text-warning"><i class="bi-star-fill"></i></span> お気に入り ${num(w.favorites)} ・ 訪問 ${num(w.visits)}</div>
                            <p class="lead">${esc(w.note || '（未記入）')}</p>
                            ${w.official ? `<p class="small text-muted">VRChat原文：${esc(w.official)}</p>` : ''}
                            ${(w.tags || []).length ? `<div class="d-flex flex-wrap gap-2 mb-4">${w.tags.map(t => `<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-ws-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
                            <div class="d-flex flex-wrap gap-2">
                                <a class="btn btn-dark flex-shrink-0" href="${url(w.id)}" target="_blank" rel="noopener"><i class="bi-box-arrow-up-right me-1"></i>VRChatで開く</a>
                                ${m.hasNav ? `<button class="btn btn-outline-dark" type="button" data-ws-prev><i class="bi-chevron-left"></i></button><span class="align-self-center text-muted small">${m.pos} / ${m.total}</span><button class="btn btn-outline-dark" type="button" data-ws-next><i class="bi-chevron-right"></i></button>` : ''}
                            </div>
                        </div>
                    </div>
                    ${m.rel.length ? `<h3 class="fw-bolder h5 mt-5 mb-3">この商品に近いワールド</h3>
                    <div class="row gx-3 row-cols-2 row-cols-md-4">${m.rel.map(r => `<div class="col mb-3"><div class="card h-100" role="button" data-ws-rel="${r.id}"><img class="card-img-top" loading="lazy" src="${esc(img(r, 256))}" alt="" onerror="this.style.visibility='hidden'" /><div class="card-body p-2"><div class="small fw-bold item-name">${esc(r.name)}</div></div></div></div>`).join('')}</div>` : ''}
                </div>`, { show: () => bsModal.show(), hide: () => bsModal.hide() });
        })();
        </script>
    </body>
</html>
